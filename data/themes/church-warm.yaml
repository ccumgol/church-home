# ══════════════════════════════════════════════════════════════════════════════
# Church Warm — 샘플교회 테마팩
# ══════════════════════════════════════════════════════════════════════════════
# design.md 의 "Sacred Warmth & Editorial Clarity" 를 프레임워크 수준에서 구현합니다.
#
# 이 파일이 있기 전에는 HugoBlox 기본 테마(indigo/teal + 남색 #0f172a)를 쓰면서
# custom.css 에서 !important 로 일일이 덮어쓰고 있었습니다. 그래서 곳곳에
# 차가운 라벤더·남색이 배어 나왔습니다. 여기서 색을 한 번 정해 두면
# 버튼·카드·배지 등 프레임워크가 그리는 모든 요소가 따뜻한 색으로 나옵니다.
#
# 색을 바꾸고 싶으면 이 파일만 고치세요. (params.yaml 의 theme.pack 이 가리킵니다)
#
#   primary   테라코타 — 버튼, 링크, 강조
#   secondary 앰버 골드 — 보조 강조, 그라디언트 방향
#   neutral   stone     — 회색 계열을 따뜻한 톤으로 (기본 gray 는 푸른기가 돎)
# ══════════════════════════════════════════════════════════════════════════════

hugoblox:
  meta:
    format: "hugoblox-theme@1"
    name: "Church Warm"
    vendor: "church-home"
    version: "1.0.0"
    license: "MIT"

  type: "dual"

  # ── 밝은 모드 — 따뜻한 리넨 종이 위의 진한 에스프레소 활자 ──────────────
  light:
    colors:
      primary: "#d95d12"   # Warm Terracotta
      secondary: "#b45309" # Sacred Amber (primary 보다 깊게 두어 그라디언트에 방향성)
      neutral: "stone"     # 따뜻한 회색
    surfaces:
      background: "#faf8f5" # Warm Linen
      foreground: "#221e1a" # Deep Espresso
      header:
        background: "#faf8f5"
        foreground: "#221e1a"
      footer:
        background: "#1c1714" # 진한 에스프레소 (남색 아님)
        foreground: "#e7e0d8"

  # ── 어두운 모드 — 남색이 아니라 '어두운 나무/흙' 톤 ────────────────────
  dark:
    colors:
      primary: "#e8752b"   # 어두운 배경에서도 읽히도록 한 단계 밝게
      secondary: "#d9a441" # Warm Gold
      neutral: "stone"
    surfaces:
      background: "#17130f" # Deep Espresso
      foreground: "#f2ece4" # Warm Paper
      header:
        background: "#17130f"
        foreground: "#f2ece4"
      footer:
        background: "#100d0a"
        foreground: "#d9d0c5"

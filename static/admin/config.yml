# Decap CMS Configuration
# Docs: https://decapcms.org/docs/configuration-options/
#
# ⚠️  설정 방법:
#   1. GitHub OAuth App을 생성하세요 (Settings > Developer Settings > OAuth Apps)
#   2. Cloudflare Workers에 sveltia-cms-auth를 배포하세요
#   3. 아래 base_url을 배포된 Cloudflare Worker 주소로 교체하세요
#      예: https://sveltia-cms-auth.YOUR-WORKER.workers.dev

backend:
  name: github
  repo: ccumgol/church-home        # GitHub 리포지터리 (소유자/이름)
  branch: main                      # 콘텐츠가 저장될 브랜치
  base_url: https://church-admin-auth.office-a67.workers.dev  # ← Cloudflare Worker 주소로 교체
  auth_endpoint: /auth

# 미디어(이미지) 업로드 경로
#   assets/ 아래로 올려야 Hugo 가 큰 사진을 자동으로 줄여서 내보냅니다.
#   (layouts/_partials/church/media_url.html 참고)
#   static/ 으로 올리면 원본 용량 그대로 방문자에게 전송되어 페이지가 느려집니다.
media_folder: assets/media/uploads
public_folder: /media/uploads

# 로케일 설정
locale: ko

# 편집 미리보기 비활성화 (Hugo 템플릿과 호환 불가)
site_url: https://church-home.pages.dev/

# ──────────────────────────────────────────────
# 컬렉션 정의
# ──────────────────────────────────────────────
collections:

  # ⓪ 사이트 설정 (글이 아니라 설정 파일을 편집하는 컬렉션)
  #    화면 하나가 파일 하나를 통째로 다시 씁니다. 그래서 설정을 화면 단위로
  #    나눠 두었습니다. (해당 파일에는 주석을 넣지 마세요 — 저장 시 지워집니다)
  - name: settings
    label: "⚙️ 사이트 설정"
    files:
      - name: home_banner
        label: "첫 화면 배너"
        file: data/settings.yaml
        description: "홈 화면 맨 위에 어떤 배너를 보여줄지 고릅니다. 저장 후 사이트가 다시 만들어지기까지 1~2분 걸립니다."
        fields:
          - label: "배너 종류"
            name: hero_style
            widget: select
            default: "ticker"
            options:
              - { label: "티커형 — 배경 사진 한 장 + 최근소식이 한 줄씩", value: "ticker" }
              - { label: "캐러셀형 — 여러 장이 자동으로 넘어감", value: "carousel" }
            hint: "캐러셀형을 고르면 '행사안내' 글 중 '홈 화면 배너에 표시'를 켠 행사가 배너에 함께 나옵니다."

          - label: "캐러셀 전환 간격 (초)"
            name: carousel_interval_seconds
            widget: number
            value_type: int
            default: 6
            min: 0
            max: 60
            step: 1
            hint: "캐러셀형일 때만 쓰입니다. 몇 초마다 다음 장으로 넘어갈지 정합니다. 0 으로 두면 자동으로 넘어가지 않습니다."

      # ── 강조 색상 ────────────────────────────────────────────────
      #    버튼·링크·아이콘·배너 등 사이트 전체의 강조색을 한 번에 바꿉니다.
      #    (배경·글자색 같은 나머지 색은 data/themes/church-warm.yaml 에서 관리)
      - name: accent_color
        label: "강조 색상"
        file: data/theme.yaml
        description: "버튼·링크·아이콘·제목 배너 등 사이트 전체의 강조색입니다. 저장 후 반영까지 1~2분 걸립니다."
        fields:
          - label: "색상 고르기"
            name: accent_preset
            widget: select
            default: "terracotta"
            options:
              - { label: "따뜻한 테라코타 (기본)", value: "terracotta" }
              - { label: "앰버 골드", value: "amber" }
              - { label: "올리브 그린", value: "olive" }
              - { label: "딥 버건디", value: "burgundy" }
              - { label: "미드나잇 블루", value: "navy" }
              - { label: "로열 퍼플", value: "purple" }
              - { label: "직접 지정 — 아래 칸의 색을 씁니다", value: "custom" }
            hint: "미리 준비한 6가지 색은 교회 홈페이지의 따뜻한 배경과 어울리도록 맞춰 두었습니다."

          - label: "직접 지정할 색"
            name: accent_custom
            widget: color
            default: "#d95d12"
            allowInput: true
            required: false
            hint: "위에서 '직접 지정'을 골랐을 때만 쓰입니다. 너무 밝거나 형광에 가까운 색은 글씨가 잘 안 보일 수 있습니다."

      # ── 문서 제목 모양 (첫 화면 배너와 별개 화면) ──────────────────
      - name: page_heading
        label: "문서 제목 모양"
        file: data/heading.yaml
        description: "메뉴로 들어가는 모든 문서(교회소개·말씀·교회교육·양육·선교·커뮤니티·행사안내)의 제목 부분 모양입니다. 한꺼번에 적용됩니다."
        fields:
          - label: "제목 모양"
            name: page_heading_style
            widget: select
            default: "banner"
            options:
              - { label: "배너형 — 진한 테라코타 상자 안에 흰 제목 (현재 사용 중)", value: "banner" }
              - { label: "말씀형 — 밝은 주황·앰버 상자 안에 흰 제목 (예전 '주일설교' 스타일)", value: "sermon" }
              - { label: "편집형 — 작은 영문 안내 + 명조 제목 + 얇은 밑줄", value: "editorial" }
            hint: "고른 뒤 저장하면 모든 문서에 함께 반영됩니다."

  # ③ 교회소식
  - name: news
    label: "📰 교회소식"
    label_singular: "소식"
    folder: content/community/news
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: [date, title]
    # `_index.md`(섹션 안내문)가 목록에 섞이지 않도록, 글에만 붙는
    # 숨은 구분값으로 걸러 냅니다. (_index.md 에는 board 가 없습니다)
    filter: { field: board, value: news }
    fields:
      - { label: "구분", name: board, widget: hidden, default: news }
      - { label: "제목", name: title, widget: string }
      - label: "작성일"
        name: date
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
      - label: "대표 이미지"
        name: thumbnail
        widget: image
        required: false
        hint: "목록에 표시할 사진입니다. 없어도 됩니다."
      - label: "내용"
        name: body
        widget: markdown
        required: false
      - { label: "초안", name: draft, widget: boolean, default: false }

  # ④ 주보
  - name: bulletin
    label: "📄 주보"
    label_singular: "주보"
    folder: content/community/bulletin
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: [date, title]
    # `_index.md`(섹션 안내문)가 목록에 섞이지 않도록, 글에만 붙는
    # 숨은 구분값으로 걸러 냅니다. (_index.md 에는 board 가 없습니다)
    filter: { field: board, value: bulletin }
    fields:
      - { label: "구분", name: board, widget: hidden, default: bulletin }
      - { label: "제목", name: title, widget: string, hint: "예: 2026년 7월 넷째주 주보" }
      - label: "발행일"
        name: date
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
      - label: "주보 표지"
        name: thumbnail
        widget: image
        required: false
        hint: "목록에 표시할 표지 이미지입니다."
      - label: "주보 파일 (PDF)"
        name: file
        widget: file
        required: false
        hint: "올리면 목록에서 누를 때 이 파일이 새 창으로 열립니다."
      - { label: "초안", name: draft, widget: boolean, default: false }

  # ⑤ 포토앨범 — Google 포토 링크만 모읍니다 (사이트에 사진을 올리지 않습니다)
  - name: album
    label: "🖼️ 포토앨범"
    label_singular: "앨범"
    folder: content/community/album
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: [date, title]
    # `_index.md`(섹션 안내문)가 목록에 섞이지 않도록, 글에만 붙는
    # 숨은 구분값으로 걸러 냅니다. (_index.md 에는 board 가 없습니다)
    filter: { field: board, value: album }
    fields:
      - { label: "구분", name: board, widget: hidden, default: album }
      - { label: "앨범 제목", name: title, widget: string, hint: "예: 2026 여름 수련회" }
      - label: "촬영일"
        name: date
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
      - label: "대표 사진 (썸네일)"
        name: thumbnail
        widget: image
        required: false
        hint: "목록에 보여 줄 사진 한 장입니다. Google 포토에서 한 장 내려받아 올려 주세요."
      - label: "Google 포토 주소"
        name: external_url
        widget: string
        pattern: ["^https?://.+", "http:// 또는 https:// 로 시작하는 주소를 넣어 주세요."]
        hint: "Google 포토에서 '앨범 공유 → 링크 복사'로 받은 주소를 붙여 넣으세요. 목록에서 누르면 새 창으로 열립니다."
      - { label: "초안", name: draft, widget: boolean, default: false }

  # ① 주일설교
  - name: sermons
    label: "📖 주일설교"
    label_singular: "설교"
    folder: content/sermons
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: [date, title, speaker]
    preview_path: "sermons/{{slug}}"
    fields:
      - label: "설교 제목"
        name: title
        widget: string
        hint: "예: 은혜 위에 은혜를"

      - label: "예배일"
        name: date
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"

      - label: "설교자"
        name: speaker
        widget: select
        options:
          - { label: "담임목사", value: "담임목사" }
          - { label: "원로목사", value: "원로목사" }
          - { label: "초청강사", value: "초청강사" }
          - { label: "부목사", value: "부목사" }
        default: "담임목사"

      - label: "성경본문"
        name: passage
        widget: string
        hint: "예: 요한복음 1:14-18"

      - label: "성경권 (필터 태그용)"
        name: book
        widget: select
        options:
          - 창세기
          - 출애굽기
          - 레위기
          - 민수기
          - 신명기
          - 여호수아
          - 사사기
          - 룻기
          - 사무엘상
          - 사무엘하
          - 열왕기상
          - 열왕기하
          - 역대상
          - 역대하
          - 에스라
          - 느헤미야
          - 에스더
          - 욥기
          - 시편
          - 잠언
          - 전도서
          - 아가
          - 이사야
          - 예레미야
          - 예레미야애가
          - 에스겔
          - 다니엘
          - 호세아
          - 요엘
          - 아모스
          - 오바댜
          - 요나
          - 미가
          - 나훔
          - 하박국
          - 스바냐
          - 학개
          - 스가랴
          - 말라기
          - 마태복음
          - 마가복음
          - 누가복음
          - 요한복음
          - 사도행전
          - 로마서
          - 고린도전서
          - 고린도후서
          - 갈라디아서
          - 에베소서
          - 빌립보서
          - 골로새서
          - 데살로니가전서
          - 데살로니가후서
          - 디모데전서
          - 디모데후서
          - 디도서
          - 빌레몬서
          - 히브리서
          - 야고보서
          - 베드로전서
          - 베드로후서
          - 요한1서
          - 요한2서
          - 요한3서
          - 유다서
          - 요한계시록

      - label: "유튜브 영상 링크"
        name: youtube_url
        widget: string
        hint: "예: https://www.youtube.com/watch?v=xxxxxxxx"
        required: false

      - label: "절기 / 카테고리 태그"
        name: tags
        widget: list
        hint: "예: 주일대예배, 부활절, 성탄절"
        field:
          label: 태그
          name: tag
          widget: string

      - label: "초안"
        name: draft
        widget: boolean
        default: false

      - label: "설교 원고"
        name: body
        widget: markdown
        required: false
        hint: "설교 원고를 입력하세요. 비워도 됩니다."

  # ② 행사안내
  - name: events
    label: "📅 행사안내"
    label_singular: "행사"
    folder: content/event
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: [date, title]
    fields:
      - label: "행사 제목"
        name: title
        widget: string

      - label: "행사 시작일"
        name: date
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false

      - label: "행사 종료일"
        name: end_date
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        required: false

      - label: "장소"
        name: location
        widget: string
        required: false
        hint: "예: 본당, 친교실, 온라인"

      - label: "간단 설명 (목록·배너에 표시)"
        name: summary
        widget: text
        required: false
        hint: "한두 문장으로 짧게 적어 주세요."

      - label: "행사 포스터"
        name: poster
        widget: image
        required: false
        hint: "홈 화면 배너에 표시할 때 우측에 나오는 이미지입니다."

      - label: "홈 화면 배너에 표시"
        name: publish_to_home
        widget: boolean
        default: false
        required: false
        hint: "켜면 홈 화면 캐러셀 배너에 이 행사가 추가됩니다. (캐러셀 배너를 쓰는 경우에만 적용)"

      - label: "초안"
        name: draft
        widget: boolean
        default: false

      - label: "상세 내용"
        name: body
        widget: markdown
        required: false
